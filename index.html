<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>みんなでお店選び</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2a2622;--sub:#6f665c;--line:#e8dfd2;--accent:#d9482b;--accent-d:#b93a20;--ok:#2f7d4f;--warn:#a15c00;--chip:#f3ece0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
body.lock{overflow:hidden}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:1.5rem;line-height:1.3;margin:.2em 0 .3em}
h2{font-size:1.1rem;margin:0}
h3{font-size:1.1rem;margin:0;line-height:1.4;word-break:break-word}
p{margin:.5em 0}
.sub{color:var(--sub);font-size:.9rem}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;min-height:44px;padding:8px 16px;border-radius:12px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:active{background:var(--accent-d)}
.btn.danger{color:#b3261e;border-color:#e9b9b5}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.9rem;border-radius:10px}
.btn.block{display:block;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 auto}
.hero{padding:28px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.note{background:#fff7e0;border:1px solid #f0dca0;border-radius:12px;padding:10px 12px;font-size:.88rem;color:#5c4a10;margin:12px 0}
.note.ok{background:#e8f5ec;border-color:#bfe0c9;color:#1d5a35}
.badge{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;background:#e8f5ec;color:var(--ok)}
.badge.closed{background:#eee;color:#555}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--sub);margin:6px 0 12px}
.stats b{color:var(--ink)}
.rank{display:inline-block;min-width:2.2em;text-align:center;font-weight:800;font-size:.85rem;padding:1px 8px;border-radius:8px;background:var(--chip);color:var(--sub);margin-bottom:4px}
.rank.top{background:var(--accent);color:#fff}
.link{display:inline-block;margin:4px 0;color:#1a56b0;word-break:break-all;font-size:.92rem}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0;font-size:.92rem}
dl.info dt{color:var(--sub)}dl.info dd{margin:0;word-break:break-word}
.memo{background:var(--chip);border-radius:10px;padding:8px 10px;font-size:.92rem;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.votebar{display:flex;align-items:center;gap:10px;margin:10px 0 6px}
.votebar .count{font-size:1.4rem;font-weight:800;min-width:3.2em;text-align:right}
.votebar .count small{font-size:.8rem;font-weight:600;color:var(--sub)}
.votebar .btn{flex:1}
.btn.voted{background:var(--ok);border-color:var(--ok);color:#fff}
.voters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--chip);border-radius:999px;padding:1px 10px;font-size:.85rem}
.cm{border-top:1px solid var(--line);padding:8px 0;font-size:.93rem}
.cm .meta{color:var(--sub);font-size:.8rem;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cm .body{white-space:pre-wrap;word-break:break-word}
.cm .acts button{background:none;border:0;color:#1a56b0;font:inherit;font-size:.8rem;padding:4px 6px;cursor:pointer}
.cmform{display:flex;gap:8px;margin-top:8px}
.cmform input{flex:1;min-width:0}
label{display:block;font-weight:600;font-size:.92rem;margin:12px 0 4px}
label .req{color:var(--accent);font-size:.8rem;margin-left:4px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #cfc4b3;border-radius:10px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid #f0a090;border-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
.ferr{color:#b3261e;font-size:.9rem;min-height:1.2em;margin-top:8px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov{position:fixed;inset:0;background:rgba(30,25,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.x{border:0;background:none;font-size:1.8rem;line-height:1;padding:4px 10px;cursor:pointer;color:var(--sub)}
.sharebox{background:var(--chip);border-radius:10px;padding:10px;font-size:.85rem;word-break:break-all;margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2a2622;color:#fff;padding:10px 16px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{background:#b3261e}
.empty{text-align:center;color:var(--sub);padding:28px 8px}
.recent a{display:block;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;word-break:break-word}
.recent a:first-of-type{border-top:0}
.admin{border:1px dashed #d8b8b0;background:#fff8f6}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script>
(function(){
'use strict';
var CFG = window.APP_CONFIG || {};
var $app = document.getElementById('app');
var $modal = document.getElementById('modal');
var $toast = document.getElementById('toast');
var S = null, timer = null, mem = {}, justCreated = false;

/* ---------- 小さな道具 ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var store = {
  get: function(k){ try{ var v = localStorage.getItem(k); return v === null ? (mem[k] == null ? null : mem[k]) : v; }catch(e){ return mem[k] == null ? null : mem[k]; } },
  set: function(k,v){ mem[k] = v; try{ localStorage.setItem(k,v); }catch(e){} }
};
function toast(msg, err){
  $toast.textContent = msg; $toast.className = 'show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(function(){ $toast.className = ''; }, 3200);
}
function fmt(t){ try{ return new Date(t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function baseUrl(){ return location.href.split('#')[0]; }
function pageUrl(token, admin){ return baseUrl() + '#/p/' + token + (admin ? '?a=' + admin : ''); }
function copy(text, ok){
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta);
    ta.focus(); ta.select();
    try{ document.execCommand('copy'); toast(ok || 'コピーしました'); }catch(e){ window.prompt('長押ししてコピーしてください', text); }
    ta.remove();
  }
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(function(){ toast(ok || 'コピーしました'); }, fallback); }
  else fallback();
}
function host(u){ try{ return new URL(u).hostname; }catch(e){ return u; } }
function chk(v, min, max, label){
  if(v.length < min) throw new Error(label + 'を入力してください');
  if(v.length > max) throw new Error(label + 'は' + max + '文字以内で入力してください');
}

/* ---------- 通信(Supabase REST / RPC) ---------- */
function rpc(fn, args){
  if(!CFG.SUPABASE_URL || !CFG.SUPABASE_KEY || /ここ/.test(CFG.SUPABASE_URL + CFG.SUPABASE_KEY)){
    return Promise.reject(new Error('config.js の設定がまだです。手順書のSTEP 5をやり直してください。'));
  }
  return fetch(CFG.SUPABASE_URL.replace(/\/+$/,'') + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': CFG.SUPABASE_KEY },
    body: JSON.stringify(args || {})
  }).then(function(res){
    return res.text().then(function(text){
      var data = null; try{ data = text ? JSON.parse(text) : null; }catch(e){}
      if(!res.ok){
        if(data && data.code === 'P0001' && data.message) throw new Error(data.message);
        if(res.status >= 500 || res.status === 0) throw new Error('サーバーに接続できません。しばらくしてからもう一度お試しください。');
        throw new Error('処理に失敗しました（' + ((data && data.code) || res.status) + '）');
      }
      return data;
    });
  }, function(){ throw new Error('通信に失敗しました。電波の良い場所でもう一度お試しください。'); });
}

/* ---------- ルーティング ---------- */
function route(){
  var m = (location.hash || '').match(/^#\/p\/([A-Za-z0-9]+)(?:\?(.*))?$/);
  if(m) showPage(m[1], new URLSearchParams(m[2] || '')); else showTop();
}
window.addEventListener('hashchange', route);

/* ---------- トップ ---------- */
function recentList(){ try{ return JSON.parse(store.get('kp_recent') || '[]'); }catch(e){ return []; } }
function addRecent(token, title){
  var l = recentList().filter(function(x){ return x.t !== token; });
  l.unshift({t: token, n: title}); store.set('kp_recent', JSON.stringify(l.slice(0, 10)));
}
function showTop(){
  S = null; clearInterval(timer); document.title = 'みんなでお店選び';
  var rec = recentList();
  $app.innerHTML =
    '<main class="wrap"><div class="hero"><h1>🍽 みんなでお店選び</h1>' +
    '<p>お店の候補を1か所に集めて、みんなで比べて、投票で決めよう。LINEに散らばったURLとはお別れです。</p></div>' +
    '<button class="btn pri block" data-action="go-create" style="min-height:52px;font-size:1.05rem">新しいお店選びを作成</button>' +
    '<div class="note ok" style="margin-top:16px">ログイン・登録は不要です。作ったあとのURLをLINEなどで送るだけで、友だちも使えます。</div>' +
    (rec.length ? '<div class="card recent"><h2 style="margin-bottom:6px">最近開いたページ</h2>' +
      rec.map(function(r){ return '<a href="#/p/' + esc(r.t) + '">' + esc(r.n) + '</a>'; }).join('') + '</div>' : '') +
    '<p class="sub" style="margin-top:20px">個人情報や秘密にしたい内容は入力しないでください。URLを知っている人は誰でも内容を見られます。</p></main>';
}
function openCreate(){
  openModal('新しいお店選びを作成',
    '<form data-form="create"><label for="f-title">ページ名<span class="req">必須</span></label>' +
    '<input id="f-title" name="title" maxlength="80" placeholder="例：土曜日のランチ候補" autocomplete="off">' +
    '<div class="ferr"></div><button type="submit" class="btn pri block" style="margin-top:8px">作成する</button></form>');
}

/* ---------- 共有ページ ---------- */
function showPage(token, params){
  clearInterval(timer);
  var a = params && params.get('a');
  if(a){ store.set('kp_admin_' + token, a); try{ history.replaceState(null, '', baseUrl() + '#/p/' + token); }catch(e){} }
  S = { token: token, secret: store.get('kp_secret_' + token), admin: store.get('kp_admin_' + token), data: null, json: '' };
  $app.innerHTML = '<main class="wrap"><p class="empty">読み込み中…</p></main>';
  load(true).then(function(){
    timer = setInterval(function(){ if(!document.hidden && S) load().catch(function(){}); }, 7000);
  }).catch(function(err){
    $app.innerHTML = '<main class="wrap"><div class="card"><h2>ページを開けませんでした</h2><p>' + esc(err.message) + '</p>' +
      '<a class="btn block" href="#/" style="text-align:center;text-decoration:none;line-height:28px">トップへ戻る</a></div></main>';
  });
}
document.addEventListener('visibilitychange', function(){ if(!document.hidden && S) load().catch(function(){}); });

function load(first){
  var st = S;
  return rpc('get_page', { p_share: st.token, p_secret: st.secret || null, p_admin: st.admin || null }).then(function(d){
    if(S !== st) return;
    var j = JSON.stringify(d), changed = j !== st.json;
    st.json = j; st.data = d;
    if(first) addRecent(st.token, d.title);
    if(first || changed) render();
    if(!d.me && !$modal.firstChild) openNick(true);
  });
}

function ranked(){
  var cs = S.data.candidates.map(function(c){ c.votes = c.voters.length; return c; });
  cs.sort(function(a,b){ return b.votes - a.votes || new Date(a.created_at) - new Date(b.created_at); });
  var rank = 0, prev = null;
  cs.forEach(function(c,i){ if(c.votes !== prev){ rank = i + 1; prev = c.votes; } c.rank = rank; });
  return cs;
}

function render(){
  var d = S.data, closed = d.closed, cs = ranked();
  var draft = {}, act = document.activeElement, fk = act && act.dataset && act.dataset.draft, ss = act && act.selectionStart;
  $app.querySelectorAll('[data-draft]').forEach(function(el){ draft[el.dataset.draft] = el.value; });
  var totalVotes = cs.reduce(function(n,c){ return n + c.votes; }, 0);
  var dupNames = {}; d.participants.forEach(function(p){ dupNames[p.nickname] = (dupNames[p.nickname] || 0) + 1; });
  var h = '<main class="wrap">';
  h += '<p class="sub" style="margin:0"><a href="#/" style="color:inherit">← トップ</a></p>';
  h += '<h1>' + esc(d.title) + '</h1>';
  h += '<span class="badge' + (closed ? ' closed' : '') + '">' + (closed ? '投票は締め切られました' : '投票受付中') + '</span>';
  h += '<div class="stats"><span>候補 <b>' + cs.length + '</b></span><span>参加 <b>' + d.participants.length + '人</b></span><span>投票 <b>' + totalVotes + '票</b></span></div>';
  h += '<div class="row">' +
    (closed ? '' : '<button class="btn pri" data-action="add-cand">＋ お店を追加</button>') +
    '<button class="btn" data-action="share">共有URL</button>' +
    '<button class="btn" data-action="nick">' + esc(nickLabel()) + '</button></div>';
  if(closed && totalVotes > 0){
    var top = cs.filter(function(c){ return c.rank === 1; });
    h += '<div class="note ok"><b>' + (top.length > 1 ? '同票で' + top.length + '店が並びました：' : '1位：') + '</b>' +
      top.map(function(c){ return esc(c.name); }).join('、') + (top.length > 1 ? '<br>話し合って決めましょう。' : '') + '</div>';
  }
  if(!cs.length) h += '<div class="empty">まだ候補がありません。<br>「お店を追加」から入れてみましょう。</div>';
  cs.forEach(function(c){
    var mine = d.me && c.participant_id === d.me;
    var voted = d.my_vote === c.id;
    h += '<article class="card"><span class="rank' + (c.rank === 1 && c.votes > 0 ? ' top' : '') + '">' + (c.votes > 0 ? c.rank + '位' : '—') + '</span>';
    h += '<h3>' + esc(c.name) + '</h3>';
    h += '<a class="link" href="' + esc(c.url) + '" target="_blank" rel="noopener noreferrer nofollow">お店のページを開く ↗ <span class="sub">' + esc(host(c.url)) + '</span></a>';
    var rows = [['予算', c.budget], ['場所', c.area], ['最寄り駅', c.station], ['駅から', c.distance]].filter(function(r){ return r[1]; });
    if(rows.length) h += '<dl class="info">' + rows.map(function(r){ return '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>';
    if(c.memo) h += '<div class="memo">' + esc(c.memo) + '</div>';
    h += '<div class="sub">追加：' + esc(c.author || '') + '</div>';
    h += '<div class="votebar"><div class="count">' + c.votes + '<small> 票</small></div>';
    if(!closed) h += voted ? '<button class="btn voted" data-action="unvote">✓ 投票中（タップで取消）</button>'
                            : '<button class="btn pri" data-action="vote" data-id="' + esc(c.id) + '">' + (d.my_vote ? 'こっちに変更' : 'この店に投票') + '</button>';
    h += '</div>';
    if(c.voters.length) h += '<div class="voters">' + c.voters.map(function(n){ return '<span class="chip">' + esc(n) + '</span>'; }).join('') + '</div>';
    c.comments.forEach(function(m){
      var my = d.me && m.participant_id === d.me;
      h += '<div class="cm"><div class="meta"><span><b>' + esc(m.nickname) + '</b>　' + fmt(m.created_at) + (m.updated_at !== m.created_at ? '（編集済）' : '') + '</span><span class="acts">' +
        (my && !closed ? '<button data-action="edit-comment" data-id="' + esc(m.id) + '" data-cid="' + esc(c.id) + '">編集</button>' : '') +
        ((my || d.is_admin) ? '<button data-action="del-comment" data-id="' + esc(m.id) + '">削除</button>' : '') +
        '</span></div><div class="body">' + esc(m.body) + '</div></div>';
    });
    if(!closed) h += '<form class="cmform" data-form="comment"><input type="hidden" name="cid" value="' + esc(c.id) + '">' +
      '<input name="body" maxlength="300" placeholder="コメントを書く" autocomplete="off" data-draft="cm-' + esc(c.id) + '"><button type="submit" class="btn sm pri">送信</button></form>';
    if(!closed && mine) h += '<div class="row" style="margin-top:10px"><button class="btn sm" data-action="edit-cand" data-id="' + esc(c.id) + '">編集</button>' +
      '<button class="btn sm danger" data-action="del-cand" data-id="' + esc(c.id) + '">削除</button></div>';
    else if(d.is_admin) h += '<div class="row" style="margin-top:10px"><button class="btn sm danger" data-action="del-cand" data-id="' + esc(c.id) + '">幹事として削除</button></div>';
    h += '</article>';
  });
  if(d.is_admin){
    h += '<div class="card admin"><h2>幹事メニュー</h2><p class="sub">あなただけが使えます。</p><div class="row">' +
      '<button class="btn" data-action="toggle-close">' + (closed ? '投票を再開する' : '投票を締め切る') + '</button>' +
      '<button class="btn" data-action="copy-admin">幹事用リンクをコピー</button>' +
      '<button class="btn danger" data-action="del-page">ページを削除</button></div>' +
      '<p class="sub" style="margin-bottom:0">幹事用リンクは、機種変更や別のスマホから幹事操作をしたいときのために、自分だけに送って保存しておいてください（他の人に送らないで）。</p></div>';
  }
  h += '<p class="sub">ニックネームは本人確認ではありません。個人情報は入力しないでください。URLを知っている人は誰でも見られます。</p></main>';
  $app.innerHTML = h;
  $app.querySelectorAll('[data-draft]').forEach(function(el){
    if(draft[el.dataset.draft] != null) el.value = draft[el.dataset.draft];
    if(fk && el.dataset.draft === fk){ el.focus(); try{ el.setSelectionRange(ss, ss); }catch(e){} }
  });
}
function nickLabel(){
  var d = S.data; if(!d.me) return 'ニックネーム設定';
  var me = d.participants.filter(function(p){ return p.id === d.me; })[0];
  return '👤 ' + (me ? me.nickname : 'ニックネーム');
}

/* ---------- モーダル ---------- */
function openModal(title, body, lock){
  $modal.innerHTML = '<div class="ov" data-action="modal-bg"' + (lock ? ' data-lock="1"' : '') + '><div class="sheet" role="dialog" aria-modal="true">' +
    '<div class="sh-h"><h2>' + esc(title) + '</h2>' + (lock ? '' : '<button class="x" data-action="modal-close" aria-label="閉じる">×</button>') + '</div>' + body + '</div></div>';
  document.body.classList.add('lock');
  var f = $modal.querySelector('input:not([type=hidden]),textarea');
  if(f) setTimeout(function(){ f.focus(); }, 60);
}
function closeModal(){ $modal.innerHTML = ''; document.body.classList.remove('lock'); }

function openNick(first){
  var d = S.data, me = d.me && d.participants.filter(function(p){ return p.id === d.me; })[0];
  openModal(first ? 'ニックネームを入力' : 'ニックネームの変更',
    '<p class="sub">この名前が、候補・コメント・投票者として他の人に表示されます。本名でなくて大丈夫です。</p>' +
    '<form data-form="nick"><label for="f-nick">ニックネーム<span class="req">必須・20文字まで</span></label>' +
    '<input id="f-nick" name="nick" maxlength="20" autocomplete="off" value="' + esc(me ? me.nickname : '') + '">' +
    '<div class="note">ニックネームは本人確認ではありません。端末（ブラウザ）ごとに別の参加者として扱われます。同じ名前の人がいる場合は区別しにくくなるのでご注意ください。</div>' +
    '<div class="ferr"></div><button type="submit" class="btn pri block">' + (first ? '参加する' : '保存する') + '</button></form>', first);
}
function openShare(){
  var u = pageUrl(S.token);
  openModal('友だちに共有',
    '<p class="sub">このURLをLINEなどで送ると、友だちも参加できます。</p><div class="sharebox">' + esc(u) + '</div>' +
    '<div class="row"><button class="btn pri" data-action="copy-url">URLをコピー</button><button class="btn" data-action="line">LINEなどで共有</button></div>');
}
function candForm(c){
  c = c || {};
  function f(name, label, max, ph, req){
    return '<label for="c-' + name + '">' + label + (req ? '<span class="req">必須</span>' : '') + '</label>' +
      '<input id="c-' + name + '" name="' + name + '" maxlength="' + max + '" placeholder="' + esc(ph || '') + '" value="' + esc(c[name] || '') + '" autocomplete="off"' + (name === 'url' ? ' inputmode="url"' : '') + '>';
  }
  return '<form data-form="cand"><input type="hidden" name="id" value="' + esc(c.id || '') + '">' +
    f('name', '店名', 80, '例：〇〇食堂', true) + f('url', 'お店のURL', 500, 'https://…', true) +
    f('budget', '予算', 40, '例：1,000〜2,000円') + f('area', '場所', 60, '例：渋谷') +
    '<div class="two"><div>' + f('station', '最寄り駅', 40, '例：渋谷駅') + '</div><div>' + f('distance', '駅から', 40, '例：徒歩5分') + '</div></div>' +
    '<label for="c-memo">補足メモ</label><textarea id="c-memo" name="memo" maxlength="200">' + esc(c.memo || '') + '</textarea>' +
    '<div class="ferr"></div><button type="submit" class="btn pri block">' + (c.id ? '保存する' : '追加する') + '</button></form>';
}
function findCand(id){ return S.data.candidates.filter(function(c){ return c.id === id; })[0]; }

/* ---------- フォーム送信 ---------- */
var handlers = {
  create: function(v){
    chk(v.title, 1, 80, 'ページ名');
    return rpc('create_page', { p_title: v.title }).then(function(r){
      store.set('kp_admin_' + r.share_token, r.admin_token);
      justCreated = true; closeModal(); location.hash = '#/p/' + r.share_token;
    });
  },
  nick: function(v){
    chk(v.nick, 1, 20, 'ニックネーム');
    var p = S.data.me ? rpc('update_nickname', { p_share: S.token, p_secret: S.secret, p_nickname: v.nick })
                      : rpc('join_page', { p_share: S.token, p_nickname: v.nick }).then(function(r){ S.secret = r.secret; store.set('kp_secret_' + S.token, r.secret); });
    return p.then(function(){ closeModal(); return load(); }).then(function(){
      if(justCreated){ justCreated = false; openShare(); } else toast('保存しました');
    });
  },
  cand: function(v){
    chk(v.name, 1, 80, '店名'); chk(v.url, 1, 500, 'URL');
    if(!/^https?:\/\/\S+$/i.test(v.url)) throw new Error('URLは http:// か https:// で始まる形式で入力してください');
    chk(v.budget, 0, 40, '予算'); chk(v.area, 0, 60, '場所'); chk(v.station, 0, 40, '最寄り駅'); chk(v.distance, 0, 40, '駅から'); chk(v.memo, 0, 200, '補足メモ');
    var a = { p_share: S.token, p_secret: S.secret, p_name: v.name, p_url: v.url, p_budget: v.budget, p_area: v.area, p_station: v.station, p_distance: v.distance, p_memo: v.memo };
    if(v.id) a.p_id = v.id;
    return rpc(v.id ? 'update_candidate' : 'add_candidate', a).then(function(){ closeModal(); toast('保存しました'); return load(); });
  },
  comment: function(v, f){
    chk(v.body, 1, 300, 'コメント');
    return rpc('add_comment', { p_share: S.token, p_secret: S.secret, p_candidate: v.cid, p_body: v.body }).then(function(){ f.reset(); return load(); });
  },
  cedit: function(v){
    chk(v.body, 1, 300, 'コメント');
    return rpc('update_comment', { p_share: S.token, p_secret: S.secret, p_id: v.id, p_body: v.body }).then(function(){ closeModal(); return load(); });
  }
};
document.addEventListener('submit', function(e){
  var f = e.target, kind = f.dataset && f.dataset.form; if(!kind) return;
  e.preventDefault();
  var btn = f.querySelector('button[type=submit]'), er = f.querySelector('.ferr');
  if(er) er.textContent = '';
  var v = {}; new FormData(f).forEach(function(val, k){ v[k] = String(val).trim(); });
  if(btn) btn.disabled = true;
  Promise.resolve().then(function(){ return handlers[kind](v, f); }).catch(function(err){
    if(er) er.textContent = err.message; else toast(err.message, true);
  }).then(function(){ if(btn) btn.disabled = false; });
});

/* ---------- クリック操作 ---------- */
function run(p){ return Promise.resolve(p).catch(function(err){ toast(err.message, true); }); }
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-action]'); if(!t) return;
  var a = t.dataset.action, id = t.dataset.id, d = S && S.data;
  if(a === 'modal-bg'){ if(e.target === t && !t.dataset.lock) closeModal(); return; }
  if(a === 'modal-close') return closeModal();
  if(a === 'go-create') return openCreate();
  if(!S || !d) return;
  var base = { p_share: S.token, p_secret: S.secret };
  if(a === 'share') return openShare();
  if(a === 'copy-url') return copy(pageUrl(S.token), '共有URLをコピーしました');
  if(a === 'line'){
    var u = pageUrl(S.token), txt = '「' + d.title + '」のお店を一緒に選ぼう！';
    if(navigator.share) return run(navigator.share({ title: d.title, text: txt, url: u }).catch(function(){}));
    return void window.open('https://line.me/R/msg/text/?' + encodeURIComponent(txt + '\n' + u), '_blank');
  }
  if(a === 'copy-admin') return copy(pageUrl(S.token, S.admin), '幹事用リンクをコピーしました（自分だけで保管してください）');
  if(a === 'nick') return openNick(false);
  if(a === 'add-cand') return openModal('お店を追加', candForm());
  if(a === 'edit-cand') return openModal('お店を編集', candForm(findCand(id)));
  if(a === 'del-cand'){
    if(!confirm('このお店を削除しますか？\nコメントと投票も一緒に消えます。')) return;
    return run(rpc('delete_candidate', { p_share: S.token, p_secret: S.secret, p_id: id, p_admin: S.admin || null }).then(function(){ toast('削除しました'); return load(); }));
  }
  if(a === 'vote') return run(rpc('vote', { p_share: S.token, p_secret: S.secret, p_candidate: id }).then(function(){ toast('投票しました'); return load(); }));
  if(a === 'unvote') return run(rpc('vote', { p_share: S.token, p_secret: S.secret, p_candidate: null }).then(function(){ toast('投票を取り消しました'); return load(); }));
  if(a === 'edit-comment'){
    var c = findCand(t.dataset.cid), m = c && c.comments.filter(function(x){ return x.id === id; })[0]; if(!m) return;
    return openModal('コメントを編集', '<form data-form="cedit"><input type="hidden" name="id" value="' + esc(id) + '">' +
      '<textarea name="body" maxlength="300">' + esc(m.body) + '</textarea><div class="ferr"></div><button type="submit" class="btn pri block" style="margin-top:8px">保存する</button></form>');
  }
  if(a === 'del-comment'){
    if(!confirm('このコメントを削除しますか？')) return;
    return run(rpc('delete_comment', { p_share: S.token, p_secret: S.secret, p_id: id, p_admin: S.admin || null }).then(function(){ return load(); }));
  }
  if(a === 'toggle-close'){
    var next = !d.closed;
    if(!confirm(next ? '投票を締め切りますか？\n締め切ると、投票・追加・コメントができなくなります（あとで再開できます）。' : '投票を再開しますか？')) return;
    return run(rpc('set_closed', { p_share: S.token, p_admin: S.admin, p_closed: next }).then(function(){ return load(); }));
  }
  if(a === 'del-page'){
    if(!confirm('このページを完全に削除しますか？\n候補・コメント・投票がすべて消え、元に戻せません。')) return;
    if(!confirm('本当に削除しますか？')) return;
    return run(rpc('delete_page', { p_share: S.token, p_admin: S.admin }).then(function(){ toast('ページを削除しました'); location.hash = '#/'; }));
  }
});

route();
})();
</script>
</body>
</html>
